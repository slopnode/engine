name: Docs

on:
  push:
    branches: [main]

jobs:
  publish:
    if: ${{ !forge.event.repository.private }}
    runs-on: codeberg-small
    container: debian:bookworm-slim
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4

      - name: Build documentation
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential cmake doxygen ca-certificates
          cmake -S . -B build -DSLOPENGINE_DOCS_ONLY=ON
          cmake --build build --target docs

      - name: Deploy to Codeberg Pages
        uses: https://codeberg.org/git-pages/action@v2
        with:
          site: https://${{ forge.repository_owner }}.codeberg.page/engine/
          token: ${{ forge.token }}
          source: build/docs/html
